name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    # The plugin is dependency-free; the standalone suite exercises the real
    # provider logic against a mocked ctx (search mapping, HTML stripping,
    # SSRF guard, abort semantics) on any OS.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build and run standalone tests
        run: npm test
