name: Publish to npm

# Publishes dsh-searxng-web to https://registry.npmjs.org using npm
# Trusted Publishing (OIDC) — no long-lived tokens, no OTP.
# Requires a Trusted Publisher configured on npmjs.com for this package:
#   Provider: GitHub Actions
#   Organization or user: maxwell-feng
#   Repository: dsh-searxng-web
#   Workflow filename: publish.yml   (must match this file name exactly)
#   Allowed actions: npm publish
# See https://docs.npmjs.com/trusted-publishers/

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write # Required for OIDC trusted publishing
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # never use caching in release builds
      - name: Install dependencies
        run: npm ci
      - name: Build and run standalone tests
        run: npm test
      # npm publish runs the package's prepare step (tsc build) itself;
      # the OIDC exchange is automatic when id-token: write is present.
      # NODE_AUTH_TOKEN must be empty: actions/setup-node may otherwise inject
      # GITHUB_TOKEN as the registry credential, which shadows the OIDC flow.
      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ""